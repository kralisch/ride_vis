# How the app presents itself. Wording lives in lang/<language>.toml.

language = "en"

# Basemap shown on open: light | topo | satellite | relief | streets | osm
# (osm needs a referrer and is hidden when the page is opened from disk)
basemap = "satellite"

# Start tilted, and how strongly the terrain is exaggerated (1 to 3).
terrain = true
exaggeration = 1.5
