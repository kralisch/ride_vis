# Copy to ride.toml and fill in. The real file stays out of the repository.
#
# Paths are relative to the project folder, or absolute.

[tour]
title = "My ride"
track = "gpx/track.gpx"

# Optional. Folder of planned stage files named "<n>_<name>.gpx"; only their
# names are read, to label the riding days. Without it days are "Day 1" and so on.
# stages = "gpx/stages"

# Optional. Local time of the ride against the UTC stamps in the track, and the
# fallback for cameras that write no offset into EXIF. Default 0.
# utc_offset_hours = 2

# One block per collection.
#   name      label in the app, next to its switch
#   location  folder of photos
#   id        optional; derived from the name otherwise. Appears in file paths
#             and deep links, so lowercase, digits and dashes only.
#   enabled   optional; whether the collection starts switched on. Default yes.
#   color     optional; ring colour of the markers. Assigned in turn as aqua,
#             violet, yellow. A fourth collection turns grey unless it sets one.
#   exclude   optional; file names that stay in the source folder but never
#             reach the bundle. Example: exclude = ["20240830_120000.jpg"]
#   utc_offset_hours
#             optional; overrides the tour offset for this camera.
#   clock_offset_minutes
#             optional; corrects a camera clock that was set wrong. The value is
#             added to every capture time, so a camera running seven minutes
#             behind needs +7. Default 0.

[[collection]]
name = "My camera"
location = "data/camera"

[[collection]]
name = "My phone"
location = "data/phone"
